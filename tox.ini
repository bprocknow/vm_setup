[tox]
env_list = venv, tests
min_version = 4.0
skipsdist = true

[testenv:venv]
description = Create a local editable install in .venv
env_dir = {tox_root}/.venv
package = skip
commands =
    python -m pip install -U pip
    python -m pip install -e {tox_root}

[testenv:tests]
description = Run the unit test suite
sitepackages = true
package = skip
setenv =
    PYTHONPATH = {tox_root}/src
commands =
    python -m unittest discover -s {tox_root}/tests -v
